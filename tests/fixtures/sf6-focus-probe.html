<!doctype html>
<meta charset="utf-8">
<title>SF6R focus probe</title>
<style>
  body { max-width: 40rem; margin: 3rem auto; font: 18px system-ui; }
  label { display: block; margin: 1.5rem 0; }
  input, button { font: inherit; }
  pre { white-space: pre-wrap; }
</style>
<h1>Keyboard memo</h1>
<p>Enter <code>cobalt heron 47</code> in Memo. Leave Reference unchanged.</p>
<label>Memo <input id="memo" autocomplete="off"></label>
<label>Reference <input id="reference" value="reference stays" autocomplete="off"></label>
<button id="move" type="button">Move focus to Reference after refusal</button>
<section id="evidence" aria-label="Probe evidence"></section>
<script>
'use strict';
const memo = document.getElementById('memo');
const reference = document.getElementById('reference');
const evidence = document.getElementById('evidence');
const events = [];
const documentId = crypto.randomUUID();
let phase = 'before-refusal';
let observedFocus;
// A background Firefox document can change activeElement without delivering focusin.
// Record the observed state under its own name, never as a synthetic DOM event.
const observeFocus = () => {
  const field = document.activeElement?.id ?? '';
  if (field !== observedFocus) {
    observedFocus = field;
    // index is the monotonically increasing sequence for all observations, including focus leaving a field.
    events.push({ index: events.length, phase, type: 'focus-observed', field });
  }
};
const snapshot = () => {
  observeFocus();
  return { documentId, phase, memo: memo.value, reference: reference.value,
    focus: document.activeElement?.id ?? '', events: events.map(event => ({ ...event })) };
};
let revision = 0;
let published;
const publish = () => {
  const json = JSON.stringify(snapshot());
  if (json === published) return;
  published = json;
  // Firefox's engine tree cuts each static text value at 512 characters. Keep
  // each block below that cap, with one revision and a complete ordered count.
  const encoded = encodeURIComponent(json);
  const count = Math.ceil(encoded.length / 320);
  revision++;
  evidence.replaceChildren(...Array.from({ length: count }, (_, index) => {
    const block = document.createElement('pre');
    block.textContent = `SF6/1:${documentId}:${revision}:${index}:${count}:${encoded.slice(index * 320, (index + 1) * 320)}`;
    return block;
  }));
};
for (const type of ['focus', 'blur']) document.addEventListener(type, publish, true);
setInterval(publish, 100);
for (const type of ['focusin', 'pointerdown', 'keydown', 'beforeinput', 'input']) {
  document.addEventListener(type, event => {
    if (![memo, reference].includes(event.target)) return;
    observeFocus();
    if (type !== 'focusin') events.push({ index: events.length, phase, type, field: event.target.id });
    publish();
  }, true);
}
document.getElementById('move').addEventListener('click', () => {
  phase = 'after-refusal';
  reference.focus();
  publish();
});
// Read-only evidence for the fixture driver. No app or browser automation lives here.
window.sf6Probe = Object.freeze({ snapshot });
memo.focus();
publish();
</script>
