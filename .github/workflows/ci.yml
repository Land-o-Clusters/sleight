name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mods need Claude Code 2.1.287 or later; pinned so a CLI release can't
      # change what CI checks without a commit here.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.288
      - name: Relay tests
        run: npm test
      - name: Validate marketplace and plugin
        run: npm run validate
      - name: Mod tests
        run: npm run test:mod
      # Same Vale version as local development, checked against the
      # release's published SHA-256 before it runs.
      - name: Install Vale
        run: |
          curl -fsSL -o vale.tgz https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
          echo "867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214  vale.tgz" | sha256sum -c -
          tar -xzf vale.tgz vale
          sudo mv vale /usr/local/bin/vale
          rm vale.tgz
      - name: Prose lint
        run: |
          vale sync
          npm run lint:prose
