name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mods need Claude Code 2.1.287 or later; pinned so a CLI release can't
      # change what CI checks without a commit here.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.288
      - name: Relay tests
        run: npm test
      - name: Validate marketplace and plugin
        run: npm run validate
      - name: Mod tests
        run: npm run test:mod
