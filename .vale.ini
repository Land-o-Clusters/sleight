# Prose lint for the docs. AI-tells flags the mechanical patterns of
# AI-written text; it never rewrites anything. `vale sync` fetches the
# pinned pack into .vale/styles (not committed).
StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

[*.md]
BasedOnStyles = ai-tells
