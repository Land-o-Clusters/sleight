[project]
name = "sleight-browser-use-arm"
version = "0"
description = "FowlBrowser arm: Browser Use agent loop on local Chrome"
requires-python = ">=3.11"
dependencies = [
  "browser-use==0.13.11",
]

[tool.uv]
package = false
# DEP2, DEP3, DEP4: Browser Use 0.13.11 pins affected versions; keep this arm patched.
override-dependencies = [
  "aiohttp==3.14.4",
  "anyio==4.14.2",
  "certifi==2026.10.18",
  "mcp==2.2.0",
  "pillow==13.0.0",
  "oauthlib==4.0.1",
  "pyasn1==0.6.5",
  "pypdf==6.21.4",
]
